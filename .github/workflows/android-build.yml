name: Buat APK BELI SAWIT

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v5

      - name: Siapkan Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Android SDK Platform dan Build Tools
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools tidak ditemukan"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bangun APK BELI SAWIT
        run: gradle --no-daemon assembleDebug

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: BELI-SAWIT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
